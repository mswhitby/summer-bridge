<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JISD Summer Bridge Schedule</title>
  <script>
    const link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'style.css?v=' + Date.now();
    document.head.appendChild(link);
  </script>
</head>
<body>
<div class="app">

  <div class="hero">
    <h1>JISD Summer Bridge</h1>
    <p>JISD · June 8–11, 2026</p>
  </div>

  <div class="tabs" role="tablist">
    <button class="tab active" onclick="switchTab('student')">Student</button>
    <button class="tab" onclick="switchTab('teacher')">Teacher</button>
  </div>

  <!-- STUDENT TAB -->
  <div id="student" class="section active">
    <div id="student-picker">
      <div id="student-day-tabs" class="day-tabs" style="margin-bottom:1.25rem"></div>
      <p class="label">What is your group number?</p>
      <select id="group-select" aria-label="Select group number">
        <option value="">Select your group number…</option>
      </select>
      <p class="label" style="margin-top:1.25rem">Or search your name</p>
      <div class="search-wrap">
        <input type="text" id="student-search" placeholder="Search your name…"
               oninput="onStudentSearch()" autocomplete="off" aria-label="Search student name">
        <div id="student-search-results"></div>
      </div>
    </div>
    <div id="student-sched-view" style="display:none">
      <button class="back-btn" onclick="clearStudentSchedule()">← Back</button>
      <div id="student-badge"></div>
      <div id="student-blocks" class="card"></div>
    </div>
  </div>

  <!-- TEACHER TAB -->
  <div id="teacher" class="section">
    <div id="teacher-search-wrap" class="search-wrap">
      <input type="text" id="teacher-search" placeholder="Search your name…"
             oninput="onTeacherSearch()" autocomplete="off" aria-label="Search teacher name">
      <div id="teacher-results"></div>
    </div>
    <div id="teacher-sched-view" style="display:none">
      <button class="back-btn" onclick="clearTeacherSchedule()">← Back to search</button>
      <div id="teacher-badge"></div>
      <div id="teacher-day-tabs"></div>
      <div id="teacher-blocks"></div>
    </div>
  </div>

</div>
<script>
  const s = document.createElement('script');
  s.src = 'script.js?v=' + Date.now();
  document.body.appendChild(s);
</script>
</body>
</html>
