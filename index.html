<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>P-TECH Summer Bridge Schedule</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <div class="hero">
    <h1>P-TECH Summer Bridge</h1>
    <p>JISD · June 8–11, 2026</p>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="Search your name…"
           oninput="onSearch()" autocomplete="off" aria-label="Search your name">
    <div id="search-results"></div>
  </div>

  <!-- Schedule view (hidden until a student+day is selected) -->
  <div id="sched-view" style="display:none">
    <button class="back-btn" onclick="clearSchedule()">← Back to search</button>
    <div id="sched-badge"></div>
    <div id="sched-day-tabs"></div>
    <div id="sched-blocks" class="card"></div>
  </div>

</div>
<script src="script.js"></script>
</body>
</html>
